le\":\"AI-Powered Clinical Health Risk Prediction System\",\"tagline\":\"End-to-end Machine Learning Pipeline \u0026 Real-Time Flask Inference API\",\"description\":\"An intelligent healthcare analytics system trained on 768 patient records across 8 vital physiological features. Delivers real-time diagnostic risk probability scores through a high-performance Flask API and an interactive web interface.\",\"problem_statement\":\"Early detection of health complications is critical, but manual evaluation of multiple physiological biomarkers is prone to oversight and delays in clinical triage. Healthcare providers need an accessible, interpretable, and low-latency prediction tool that translates structured clinical metrics into accurate risk scores.\",\"solution_overview\":\"Engineered an end-to-end machine learning solution encompassing robust data preprocessing, outlier detection, feature standardization, predictive model training, cross-validation, and deployment via a RESTful Flask API with an interactive web scoring interface.\",\"architecture_details\":\"Client Browser UI -\u003e REST Request -\u003e Flask Application Layer -\u003e Preprocessing \u0026 Scaling Pipeline (StandardScaler) -\u003e Trained Scikit-Learn Classifier -\u003e Probability Distribution Output -\u003e Real-time Visual Risk Score\",\"implementation_highlights\":[\"Cleaned and validated 768 patient records across 8 physiological features (Glucose, Blood Pressure, Insulin, BMI, Age, etc.)\",\"Built full pipeline with missing value imputation, feature correlation analysis, and standard scaling\",\"Trained and evaluated multiple classification models (Logistic Regression, Random Forest, Gradient Boosting) using cross-validation\",\"Deployed production-ready Flask API with CORS support, JSON input validation, and sub-50ms inference response\",\"Authored interactive web interface for clinicians to input patient parameters and view instantaneous risk breakdowns\"],\"key_results\":[\"Achieved 87% diagnostic accuracy on clinical test evaluation set\",\"Processed 768 patient records across 8 physiological parameters\",\"Sub-50 millisecond inference response time via Flask REST API\",\"Publicly deployed web application with complete Swagger/OpenAPI documentation\"],\"technologies\":[\"Python\",\"Scikit-learn\",\"Pandas\",\"NumPy\",\"Flask\",\"HTML5\",\"CSS3\",\"Bootstrap\",\"Docker\"],\"metrics\":[{\"label\":\"Model Accuracy\",\"value\":\"87%\"},{\"label\":\"Clinical Records\",\"value\":\"768\"},{\"label\":\"Physiological Features\",\"value\":\"8\"},{\"label\":\"API Response\",\"value\":\"\u003c 50ms\"}],\"github_url\":\"https://github.com/Subha-Dhanusha/medirisk-ai\",\"live_url\":\"https://subha-dhanusha.github.io/medirisk-ai\",\"api_url\":\"https://medirisk-ai.onrender.com/docs\",\"thumbnail_url\":\"/assets/projects/medirisk-thumb.svg\",\"banner_url\":\"/assets/projects/medirisk-banner.svg\",\"architecture_diagram_type\":\"ml-pipeline\",\"architecture_steps\":[{\"desc\":\"768 Patient Clinical Samples with 8 physiological metrics\",\"name\":\"Raw Ingestion\",\"step\":\"01\"},{\"desc\":\"Missing value imputation, outlier handling, StandardScaler normalization\",\"name\":\"Feature Engineering\",\"step\":\"02\"},{\"desc\":\"Supervised classification engine with k-fold cross validation\",\"name\":\"Model Architecture\",\"step\":\"03\"},{\"desc\":\"Flask REST API on Render returning risk probabilities in real-time\",\"name\":\"Inference Endpoint\",\"step\":\"04\"}],\"interactive_type\":\"ml-inference\",\"featured\":true,\"display_order\":1,\"status\":\"published\",\"created_at\":\"2026-09-24T10:58:38.396253+00:00\",\"updated_at\":\"2026-09-24T10:58:38.396253+00:00\"},{\"id\":\"d0000000-0000-0000-0000-000000000002\",\"slug\":\"stock-market-fundamental-analysis\",\"title\":\"Stock Market Fundamental Analysis System\",\"subtitle\":\"Multi-Tier Financial Data Pipeline \u0026 Dimensional Warehouse\",\"tagline\":\"Star Schema Architecture, Fact \u0026 Dimension Modeling, and Valuation Metrics\",\"description\":\"An enterprise data pipeline and financial analytics warehouse designed to ingest, cleanse, model, and evaluate publicly listed corporate equities. Implements Star Schema dimensional modeling, advanced SQL window functions, and financial ratio analytics.\",\"problem_statement\":\"Analyzing publicly listed companies requires ingesting and reconciling disparate financial disclosures, balance sheets, and cash flow statements across quarters. Without a unified dimensional data warehouse, computing complex valuation ratios and comparative trends across industries is slow and error-prone.\",\"solution_overview\":\"Designed a multi-layered ETL pipeline that ingests financial data, applies structured transformations, loads into a Star Schema with centralized facts and dimensions, and exposes performant SQL views computing key indicators including P/E, EPS, ROE, Revenue Growth, and Debt-to-Equity (D/E).\",\"architecture_details\":\"Raw Financial Feeds -\u003e Cleansing \u0026 Profiling Stage -\u003e 3-Tier Data Pipeline -\u003e Dimensional Warehouse (Dim_Company, Dim_Date, Dim_Sector, Fact_Financial_Metrics) -\u003e Materialized SQL Views -\u003e Power BI Dashboard \u0026 Executive Valuation Reports\",\"implementation_highlights\":[\"Engineered multi-stage ETL pipeline to transform balance sheets, P\u0026L statements, and cash flows\",\"Modeled star schema with Fact_Financial_Statements surrounded by Dim_Company, Dim_Period, and Dim_Industry\",\"Implemented SQL window functions (ROW_NUMBER, LAG, LEAD, DENSE_RANK) to calculate year-over-year revenue growth\",\"Built automated SQL validation queries ensuring mathematical consistency across asset and liability balancing\",\"Created aggregated SQL analytical views for automated generation of investment equity research reports\"],\"key_results\":[\"Evaluated multi-company financial reports with 5+ core valuation ratios (P/E, EPS, ROE, Revenue Growth, D/E)\",\"Built automated data profiling and validation checks preventing data anomalies in historical records\",\"Created high-efficiency SQL views reducing query runtimes for executive reporting\",\"Integrated with BlueStock FinTech research deliverables for equity analysis\"],\"technologies\":[\"SQL\",\"MySQL\",\"Dimensional Modeling\",\"Star Schema\",\"ETL/ELT\",\"Excel (Advanced)\",\"Power BI\",\"Financial Data Modeling\"],\"metrics\":[{\"label\":\"Warehouse Schema\",\"value\":\"Star Schema\"},{\"label\":\"Valuation Metrics\",\"value\":\"P/E, EPS, ROE, D/E\"},{\"label\":\"Pipeline Architecture\",\"value\":\"3-Tier ETL\"},{\"label\":\"Validation Suite\",\"value\":\"Automated SQL\"}],\"github_url\":\"https://github.com/Subha-Dhanusha\",\"live_url\":\"https://subha-dhanusha.github.io\",\"api_url\":null,\"thumbnail_url\":\"/assets/projects/stock-analysis-thumb.svg\",\"banner_url\":\"/assets/projects/stock-analysis-banner.svg\",\"architecture_diagram_type\":\"data-pipeline\",\"architecture_steps\":[{\"desc\":\"Ingestion of company financial filings, quarterly reports \u0026 market feeds\",\"name\":\"Raw Ingestion\",\"step\":\"01\"},{\"desc\":\"Automated SQL validation, null treatment \u0026 reconciliation\",\"name\":\"Cleansing \u0026 Profiling\",\"step\":\"02\"},{\"desc\":\"Star Schema: Dim_Company, Dim_Quarter, Fact_Valuation_Metrics\",\"name\":\"Dimensional Model\",\"step\":\"03\"},{\"desc\":\"SQL analytical views feeding Power BI executive valuation dashboards\",\"name\":\"BI \u0026 Views\",\"step\":\"04\"}],\"interactive_type\":\"financial-kpi\",\"featured\":true,\"display_order\":2,\"status\":\"published\",\"created_at\":\"2026-09-24T10:58:38.396253+00:00\",\"updated_at\":\"2026-09-24T10:58:38.396253+00:00\"},{\"id\":\"d0000000-0000-0000-0000-000000000003\",\"slug\":\"network-forensic-investigation\",\"title\":\"Network Forensic Investigation \u0026 Evidence Management System\",\"subtitle\":\"Digital Forensics Platform \u0026 Immutable Evidence Chain-of-Custody\",\"tagline\":\"Packet-Level Traffic Capture, Structured Indexing \u0026 Court-Admissible Reporting\",\"description\":\"A specialized cybersecurity and digital forensic application engineered to capture, analyze, and preserve network traffic data as court-admissible electronic evidence. Features indexed storage, packet-level inspection, and tamper-evident chain-of-custody tracking.\",\"problem_statement\":\"Digital forensic investigators face major challenges capturing high-volume packet streams while maintaining verifiable chain-of-custody, preventing tampering, and producing structured incident reports that satisfy legal evidential standards.\",\"solution_overview\":\"Developed a Python and Flask application that intercepts network packets, indexes relevant protocol headers, implements cryptographic hashing to guarantee data immutability, and logs every access or modification for legally defensible chain-of-custody.\",\"architecture_details\":\"Network Interface (Promiscuous Mode) -\u003e Packet Capture Engine -\u003e Protocol Dissector (IP, TCP, UDP, DNS) -\u003e Cryptographic Hashing Layer (SHA-256) -\u003e Indexed Storage \u0026 Metadata Index -\u003e Chain-of-Custody Audit Log -\u003e Incident Reporting Web Interface\",\"implementation_highlights\":[\"Captured and dissected network packets down to byte and protocol header levels\",\"Implemented SHA-256 cryptographic hashing to verify data integrity and prevent post-capture tampering\",\"Architected an indexed evidence storage module for instant retrieval by timestamp, source IP, or protocol\",\"Engineered an immutable chain-of-custody audit log tracking investigator access, notes, and exports\",\"Built structured incident reporting dashboard generating formatted PDF/HTML digital forensic findings\"],\"key_results\":[\"Maintained 100% cryptographic data integrity and provenance across captured evidence\",\"Indexed thousands of network packets with sub-second retrieval by protocol and endpoint\",\"Court-admissible structured reporting meeting digital forensics best practices\",\"Deployed live web application accessible for forensic demonstration\"],\"technologies\":[\"Python\",\"Flask\",\"Cybersecurity\",\"Network Forensics\",\"Packet Analysis\",\"Cryptographic Hashing\",\"MySQL\",\"HTML5/CSS3\"],\"metrics\":[{\"label\":\"Protocol Coverage\",\"value\":\"IP, TCP, UDP, DNS\"},{\"label\":\"Integrity Standard\",\"value\":\"SHA-256 Chain\"},{\"label\":\"Search Retrieval\",\"value\":\"\u003c 100ms Index\"},{\"label\":\"Reporting Format\",\"value\":\"Audit Grade\"}],\"github_url\":\"https://github.com/Subha-Dhanusha/Network-Forensic-Investigation-and-evidence-management-system\",\"live_url\":\"https://nfies-web.onrender.com\",\"api_url\":null,\"thumbnail_url\":\"/assets/projects/forensic-thumb.svg\",\"banner_url\":\"/assets/projects/forensic-banner.svg\",\"architecture_diagram_type\":\"security-flow\",\"architecture_steps\":[{\"desc\":\"Live network traffic capture across interfaces with packet filtering\",\"name\":\"Packet Capture\",\"step\":\"01\"},{\"desc\":\"Header extraction, payload inspection, and protocol analysis\",\"name\":\"Deep Dissection\",\"step\":\"02\"},{\"desc\":\"Cryptographic SHA-256 hashing and immutable metadata stamping\",\"name\":\"Integrity Seal\",\"step\":\"03\"},{\"desc\":\"Strict audit trails, investigator authorization \u0026 incident export\",\"name\":\"Chain of Custody\",\"step\":\"04\"}],\"interactive_type\":\"evidence-chain\",\"featured\":true,\"display_order\":3,\"status\":\"published\",\"created_at\":\"2026-09-24T10:58:38.396253+00:00\",\"updated_at\":\"2026-09-24T10:58:38.396253+00:00\"},{\"id\":\"d0000000-0000-0000-0000-000000000004\",\"slug\":\"techvolt-fullstack-crm\",\"title\":\"Multi-Module Web Application \u0026 Data Management Platform\",\"subtitle\":\"Full-Stack Architecture \u0026 Database CRUD Workflows (Techvolt)\",\"tagline\":\"Responsive Architecture, Role-Based Authentication \u0026 Order Management\",\"description\":\"A full-stack enterprise web application built during th
