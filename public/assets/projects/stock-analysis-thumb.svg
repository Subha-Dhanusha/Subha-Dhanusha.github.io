<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11121a"/>
      <stop offset="100%" stop-color="#1c1a24"/>
    </linearGradient>
    <linearGradient id="sam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#sbg)"/>
  <rect x="40" y="40" width="720" height="420" rx="16" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <!-- Central Fact Table -->
  <rect x="310" y="180" width="180" height="120" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="215" font-family="monospace" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">FACT_FINANCIALS</text>
  <text x="400" y="245" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">P/E | EPS | ROE</text>
  <text x="400" y="270" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">D/E | Revenue Growth</text>
  <!-- Surrounding Dimension Tables -->
  <rect x="90" y="100" width="140" height="70" rx="8" fill="#0f172a" stroke="#3b82f6"/>
  <text x="160" y="132" font-family="monospace" font-size="12" fill="#3b82f6" text-anchor="middle">DIM_COMPANY</text>
  <text x="160" y="152" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Ticker, Sector</text>

  <rect x="570" y="100" width="140" height="70" rx="8" fill="#0f172a" stroke="#3b82f6"/>
  <text x="640" y="132" font-family="monospace" font-size="12" fill="#3b82f6" text-anchor="middle">DIM_PERIOD</text>
  <text x="640" y="152" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Quarter, FY</text>

  <rect x="330" y="360" width="140" height="60" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="400" y="395" font-family="monospace" font-size="12" fill="#10b981" text-anchor="middle">SQL VIEWS</text>
  <!-- Connector lines -->
  <line x1="230" y1="135" x2="310" y2="210" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="570" y1="135" x2="490" y2="210" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="400" y1="300" x2="400" y2="360" stroke="#10b981" stroke-width="1.5"/>
  <!-- Title -->
  <text x="80" y="430" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Stock Fundamental Analysis</text>
  <text x="80" y="452" font-family="sans-serif" font-size="13" fill="#94a3b8">Multi-Layer Data Pipeline, Star Schema and Valuation Views</text>
