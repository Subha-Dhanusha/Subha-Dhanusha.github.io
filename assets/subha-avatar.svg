<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1a"/>
      <stop offset="50%" stop-color="#0b1a30"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="130" fill="url(#glow)" opacity="0.25" filter="url(#blur)"/>
  <circle cx="200" cy="200" r="120" stroke="url(#glow)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="85" fill="#0c1424" stroke="url(#glow)" stroke-width="2"/>
  <!-- Stylized Monogram S.D -->
  <text x="200" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">SD</text>
  <circle cx="200" cy="242" r="4" fill="#06b6d4"/>
  <text x="200" y="340" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="3">SUBHA DHANUSHA P</text>
  <text x="200" y="360" font-family="monospace" font-size="10" fill="#06b6d4" text-anchor="middle" letter-spacing="1.5">AI - DATA - SOFTWARE</text>
</svg>